name: Bug Report
description: Report a bug or unexpected behavior in Alloy
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the sections below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Configure Alloy with...
        2. Run the following command...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: input
    id: alloy-version
    attributes:
      label: Alloy Version
      description: What version of Alloy are you running? (run `alloy --version`)
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Docker / Container
        - Kubernetes
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version / Distribution
      description: e.g. Ubuntu 22.04, macOS 13.4, Windows Server 2022
      placeholder: e.g. Ubuntu 22.04

  - type: textarea
    id: configuration
    attributes:
      label: Alloy Configuration
      description: |
        Please provide the relevant portion of your Alloy configuration file.
        **Remove any sensitive information such as passwords, tokens, or private hostnames.**
      render: hcl
      placeholder: |
        // Paste your relevant Alloy config here

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Please copy and paste any relevant log output.
        **Remove any sensitive information before posting.**
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the problem here.
